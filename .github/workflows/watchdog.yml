name: watchdog
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit.py
      - name: Commit STATUS.txt
        run: |
          git config user.name "money-boss-watchdog"
          git config user.email "watchdog@users.noreply.github.com"
          git add STATUS.txt
          git diff --cached --quiet || (git commit -m "watchdog: update STATUS.txt" && git pull --rebase && git push)
